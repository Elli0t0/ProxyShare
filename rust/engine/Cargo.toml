[package]
name = "proxyshare_engine"
version = "0.0.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "proxyshare_engine"

[dependencies]
jni = "0.21"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
socket2 = "0.5"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
