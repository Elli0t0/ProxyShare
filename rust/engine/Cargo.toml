[package]
name = "proxyshare_engine"
version = "0.0.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "proxyshare_engine"

[dependencies]
jni = "0.21"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
socket2 = "0.5"
libc = "0.2"

[dev-dependencies]
# test-util only for tests (tokio::time::pause/advance and
# #[tokio::test(start_paused = true)]): enabling it in [dependencies]
# would also ship the clock-mocking code in the release .so.
tokio = { version = "1", features = ["test-util"] }
